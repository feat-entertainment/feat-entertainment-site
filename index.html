<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>feat.Entertainment合同会社</title>
<style>
  :root { color-scheme: light dark; --bg:#FBF5EA; --card:#fff; --text:#222; --sub:rgba(34,34,34,0.7); --blue:#0A7EA4; --border:rgba(0,0,0,0.08); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --card:#2c2c2e; --text:#eee; --sub:rgba(238,238,238,0.7); --blue:#6db8dd; --border:rgba(255,255,255,0.08); }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0; line-height: 1.8; color: var(--text); background: var(--bg);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 64px 20px 80px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .en { opacity: 0.5; font-size: 0.95rem; margin: 0 0 40px; }
  h2 { font-size: 1.05rem; margin: 40px 0 16px; }
  p { color: var(--sub); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 24px; margin: 12px 0;
  }
  .card a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .card p { margin: 6px 0 0; font-size: 0.92rem; }
  footer { margin-top: 56px; font-size: 0.85rem; color: var(--sub); }
  footer a { color: inherit; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>feat.Entertainment合同会社</h1>

    <h2>プロダクト</h2>
    <div class="card">
      <a href="https://kosodate-baton.feat-entertainment.com/">こそだてバトン ↗</a>
      <p>ママが不在の「もしも」に、パパが迷わず対応できる育児情報共有アプリ。</p>
    </div>

    <h2>お問い合わせ</h2>
    <p><a href="mailto:feat.entertainment.llc@gmail.com" style="color:var(--blue)">feat.entertainment.llc@gmail.com</a></p>

    <footer>
      <p>© 2026 feat.Entertainment合同会社</p>
    </footer>
  </div>
</body>
</html>
